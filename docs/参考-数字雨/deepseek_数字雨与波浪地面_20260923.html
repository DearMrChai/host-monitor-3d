<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>3D 监控 - 点阵涟漪地形</title>
<style>
  body { margin: 0; overflow: hidden; background-color: #050508; }
  canvas { display: block; }
  #ui {
    position: absolute; top: 20px; left: 20px; color: #fff;
    font-family: 'Courier New', monospace; font-size: 14px;
    pointer-events: none; line-height: 1.6;
    background: rgba(0,0,0,0.7); padding: 15px; border-radius: 8px;
    border: 1px solid #333;
  }
  .green { color: #00ff41; }
  .yellow { color: #ffcc00; }
  .red { color: #ff0033; }
  .offline { color: #444; }
  
  #panel {
    position: absolute; top: 20px; right: 20px;
    background: rgba(10, 15, 10, 0.9);
    border: 1px solid #00ff41; border-radius: 8px;
    padding: 18px 20px;
    font-family: 'Courier New', monospace; font-size: 13px;
    color: #00ff41; width: 300px;
    box-shadow: 0 0 20px rgba(0, 255, 65, 0.2);
    backdrop-filter: blur(10px);
  }
  #panel h3 {
    margin: 0 0 15px 0; font-size: 13px; letter-spacing: 1px;
    border-bottom: 1px solid #00ff4155; padding-bottom: 8px;
  }
  .slider-row { margin-bottom: 12px; }
  .slider-row label {
    display: flex; justify-content: space-between;
    margin-bottom: 5px; font-size: 11px; opacity: 0.85;
  }
  .slider-row .val { color: #fff; font-weight: bold; }
  .slider-row input[type="range"] {
    width: 100%; -webkit-appearance: none; background: transparent; cursor: pointer;
  }
  .slider-row input[type="range"]::-webkit-slider-runnable-track {
    height: 4px; background: #1a2a1a; border-radius: 2px; border: 1px solid #00ff4144;
  }
  .slider-row input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 14px; height: 14px;
    background: #00ff41; border-radius: 50%; margin-top: -6px;
    box-shadow: 0 0 10px #00ff41;
  }
  .divider { border-top: 1px dashed #00ff4155; padding-top: 12px; margin-top: 12px; }
  .btn-row {
    display: flex; gap: 8px; margin-top: 8px;
  }
  .btn-row button {
    flex: 1; padding: 6px;
    background: transparent; border: 1px solid #00ff4188;
    color: #00ff41; font-family: inherit; font-size: 11px;
    cursor: pointer; border-radius: 4px;
    transition: all 0.2s;
  }
  .btn-row button:hover { background: #00ff4122; }
  .btn-row button.active { background: #00ff4144; color: #fff; }
</style>
</head>
<body>
<div id="ui">
  <div>[系统] 集群节点监控矩阵</div>
  <div class="green">● 节点 A - 安谧运行</div>
  <div class="yellow">● 节点 B - 数据活跃</div>
  <div class="red">● 节点 C - 高负载警告</div>
</div>

<div id="panel">
  <h3>◆ 涟漪参数</h3>
  <div class="slider-row">
    <label><span>涟漪高度</span><span class="val" id="v1">2.5</span></label>
    <input type="range" id="rippleHeight" min="0" max="10" step="0.1" value="2.5">
  </div>
  <div class="slider-row">
    <label><span>涟漪速度</span><span class="val" id="v2">22.0</span></label>
    <input type="range" id="rippleSpeed" min="5" max="60" step="1" value="22">
  </div>
  <div class="slider-row">
    <label><span>涟漪厚度</span><span class="val" id="v3">1.2</span></label>
    <input type="range" id="rippleThickness" min="0.3" max="4" step="0.1" value="1.2">
  </div>
  <div class="slider-row">
    <label><span>涟漪亮度</span><span class="val" id="v4">1.0</span></label>
    <input type="range" id="rippleBrightness" min="0" max="2" step="0.05" value="1.0">
  </div>
  <div class="slider-row">
    <label><span>涟漪存活(秒)</span><span class="val" id="v5">4.0</span></label>
    <input type="range" id="rippleMaxAge" min="1" max="10" step="0.5" value="4">
  </div>
  <div class="slider-row divider">
    <label><span style="color:#00aaff;">数字雨亮度</span><span class="val" id="v6">0.25</span></label>
    <input type="range" id="rainBrightness" min="0" max="0.8" step="0.01" value="0.25">
  </div>
  
  <h3 style="margin-top: 18px;">◆ 设备状态模拟</h3>
  <div class="btn-row">
    <button id="allOnline" class="active">全部在线</button>
    <button id="onlyOne">只开一台</button>
    <button id="allOffline">全部关机</button>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* ============================================================================
 * ① 全局参数
 * ============================================================================
 */
const PULSE_SETTINGS = {
  rippleHeight: 2.5,        // 涟漪垂直高度
  rippleSpeed: 22,          // 涟漪扩散速度（单位/秒）
  rippleThickness: 1.2,     // 涟漪环厚度（越小越锐利）
  rippleBrightness: 1.0,    // 涟漪整体亮度
  rippleMaxAge: 4.0,        // 涟漪最长存活时间（秒）
  rainBrightness: 0.25      // 数字雨亮度
};

/* ============================================================================
 * ② 状态定义
 * ============================================================================
 * interval: 涟漪发射间隔（秒）
 * burst:    每次爆发发射几个涟漪（形成 嘟 / 嘟嘟 / 嘟嘟嘟 节奏）
 * amplitude: 涟漪强度（0~1，会影响高度和亮度）
 * OFFLINE 状态不会被使用（不发射涟漪）
 * ============================================================================
 */
const STATES = {
  IDLE:    { color: 0x00ff41, interval: 3.0, burst: 1, amplitude: 0.6 },  // 绿 - 单发，低幅
  ACTIVE:  { color: 0xffcc00, interval: 2.0, burst: 2, amplitude: 0.85 }, // 黄 - 双发，中幅
  ALERT:   { color: 0xff0033, interval: 1.2, burst: 3, amplitude: 1.2 },  // 红 - 三连发，高幅
  OFFLINE: { color: 0x222222, interval: 999, burst: 0, amplitude: 0 }     // 关机 - 无涟漪
};

/* ============================================================================
 * ③ 场景 / 相机 / 渲染器
 * ============================================================================
 */
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x050508, 0.006);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 30, 60);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 3, 0);
controls.enableDamping = true;

scene.add(new THREE.AmbientLight(0xffffff, 0.15));
const topLight = new THREE.DirectionalLight(0xffffff, 1.5);
topLight.position.set(10, 20, 10);
scene.add(topLight);

/* ============================================================================
 * ④ 辉光
 * ============================================================================
 */
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloomPass = new UnrealBloomPass(
  new THREE.Vector2(window.innerWidth, window.innerHeight),
  1.4, 0.5, 0.75
);
composer.addPass(bloomPass);
composer.addPass(new OutputPass());

/* ============================================================================
 * ⑤ 粒子贴图
 * ============================================================================
 */
function createRoundTexture() {
  const canvas = document.createElement('canvas');
  canvas.width = 64; canvas.height = 64;
  const ctx = canvas.getContext('2d');
  const g = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
  g.addColorStop(0, 'rgba(255, 255, 255, 1)');
  g.addColorStop(0.3, 'rgba(255, 255, 255, 0.7)');
  g.addColorStop(0.7, 'rgba(255, 255, 255, 0.2)');
  g.addColorStop(1, 'rgba(0, 0, 0, 0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, 64, 64);
  return new THREE.CanvasTexture(canvas);
}
const roundTexture = createRoundTexture();

/* ============================================================================
 * ⑥ 核心：点阵涟漪地形
 * ----------------------------------------------------------------------------
 * 平静时：一张纯平的点阵网格（暗蓝色）
 * 有涟漪时：涟漪经过的顶点被"抬升"并点亮
 * 涟漪可以叠加（多台设备同时活跃时，它们的涟漪会互相穿过）
 * ============================================================================
 */
class RippleTerrain {
  constructor(scene) {
    this.scene = scene;
    
    // 平面：200x200 单位，180x180 细分（32400 顶点，够细腻）
    const size = 200;
    const segments = 160;
    this.geometry = new THREE.PlaneGeometry(size, size, segments, segments);
    this.geometry.rotateX(-Math.PI / 2);
    
    // 保存基础平面坐标
    this.basePositions = this.geometry.attributes.position.array.slice();
    this.count = this.basePositions.length / 3;
    
    // 顶点颜色（初始全部暗蓝）
    const colors = new Float32Array(this.count * 3);
    for (let i = 0; i < this.count; i++) {
      colors[i * 3]     = 0.02;
      colors[i * 3 + 1] = 0.06;
      colors[i * 3 + 2] = 0.15;
    }
    this.geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
    
    // 使用圆点贴图，配合顶点色 —— 形成细腻的点阵网格
    const material = new THREE.PointsMaterial({
      size: 0.8,
      map: roundTexture,
      vertexColors: true,
      transparent: true,
      opacity: 0.85,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      sizeAttenuation: true
    });
    
    this.mesh = new THREE.Points(this.geometry, material);
    this.scene.add(this.mesh);
    
    // 涟漪列表
    this.ripples = [];
  }
  
  // 在 (x, z) 位置激起一个涟漪
  // color: 十六进制颜色；amplitude: 强度系数（0~1.5）
  addRipple(x, z, colorHex, amplitude = 1.0) {
    const c = new THREE.Color(colorHex);
    this.ripples.push({
      x, z,
      colorR: c.r,
      colorG: c.g,
      colorB: c.b,
      age: 0,
      radius: 0,
      amplitude
    });
  }
  
  // 每帧更新
  update(delta) {
    const positions = this.geometry.attributes.position.array;
    const colors = this.geometry.attributes.color.array;
    const basePos = this.basePositions;
    const height = PULSE_SETTINGS.rippleHeight;
    const speed = PULSE_SETTINGS.rippleSpeed;
    const thickness = PULSE_SETTINGS.rippleThickness;
    const brightness = PULSE_SETTINGS.rippleBrightness;
    const maxAge = PULSE_SETTINGS.rippleMaxAge;
    
    // 更新每个涟漪的半径和寿命
    for (let i = this.ripples.length - 1; i >= 0; i--) {
      const r = this.ripples[i];
      r.age += delta;
      r.radius = r.age * speed;
      if (r.age >= maxAge || r.radius > 120) {
        this.ripples.splice(i, 1);
      }
    }
    
    // 遍历所有顶点
    for (let i = 0; i < this.count; i++) {
      const bx = basePos[i * 3];
      const bz = basePos[i * 3 + 2];
      
      let y = 0;
      let cr = 0.02, cg = 0.06, cb = 0.15; // 基础色（暗蓝）
      
      // 遍历所有涟漪，累加它们对当前顶点的贡献
      for (let k = 0; k < this.ripples.length; k++) {
        const r = this.ripples[k];
        const dx = bx - r.x;
        const dz = bz - r.z;
        const dist = Math.sqrt(dx * dx + dz * dz);
        
        // 到当前涟漪环的距离（d=0 表示正好在环上）
        const d = dist - r.radius;
        
        // 高斯钟形包络：环形区域内的顶点才受涟漪影响
        const envelope = Math.exp(-(d * d) / (thickness * thickness * 100));
        
        // 生命周期衰减（越老越弱）
        const ageDecay = 1 - r.age / maxAge;
        
        // 距离衰减（越远越弱）
        const distanceDecay = Math.exp(-r.radius * 0.008);
        
        // 综合振幅
        const wave = Math.sin(d * 0.5) * envelope * ageDecay * distanceDecay * r.amplitude;
        
        // 叠加到高度
        y += wave * height;
        
        // 涟漪经过时点亮顶点颜色（只取正向波，避免出现"黑洞"）
        const glow = Math.abs(wave) * brightness;
        cr += r.colorR * glow * 0.9;
        cg += r.colorG * glow * 0.9;
        cb += r.colorB * glow * 0.9;
      }
      
      // 写入位置
      positions[i * 3 + 1] = y;
      
      // 写入颜色（钳制在 0~1）
      colors[i * 3]     = Math.min(1, cr);
      colors[i * 3 + 1] = Math.min(1, cg);
      colors[i * 3 + 2] = Math.min(1, cb);
    }
    
    this.geometry.attributes.position.needsUpdate = true;
    this.geometry.attributes.color.needsUpdate = true;
  }
}

const rippleTerrain = new RippleTerrain(scene);

/* ============================================================================
 * ⑦ 数字雨背景
 * ============================================================================
 */
class DigitalRainBackground {
  constructor(scene) {
    this.scene = scene;
    this.rain = null;
    this.bokeh = null;
    this._createRainTexture();
    this._createRainParticles();
    this._createBokehParticles();
  }
  
  _createRainTexture() {
    const canvas = document.createElement('canvas');
    canvas.width = 128; canvas.height = 128;
    const ctx = canvas.getContext('2d');
    ctx.font = 'bold 100px "Courier New", monospace';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.shadowColor = '#00aaff'; ctx.shadowBlur = 15;
    ctx.fillStyle = '#ffffff';
    ctx.fillText(Math.random() > 0.5 ? '0' : '1', 64, 64);
    return new THREE.CanvasTexture(canvas);
  }
  
  _createRainParticles() {
    const count = 800;
    const geometry = new THREE.BufferGeometry();
    const positions = new Float32Array(count * 3);
    const speeds = new Float32Array(count);
    for (let i = 0; i < count; i++) {
      positions[i * 3]     = (Math.random() - 0.5) * 220;
      positions[i * 3 + 1] = Math.random() * 80;
      positions[i * 3 + 2] = -40 - Math.random() * 80;
      speeds[i] = 3 + Math.random() * 5;
    }
    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    const texture = this._createRainTexture();
    const material = new THREE.PointsMaterial({
      color: 0x0088ff, size: 1.8, map: texture,
      transparent: true, opacity: 0, blending: THREE.AdditiveBlending,
      depthWrite: false, sizeAttenuation: true
    });
    this.rain = new THREE.Points(geometry, material);
    this.rain.userData.speeds = speeds;
    this.scene.add(this.rain);
  }
  
  _createBokehParticles() {
    const count = 150;
    const geo = new THREE.BufferGeometry();
    const pos = new Float32Array(count * 3);
    for (let i = 0; i < count; i++) {
      pos[i * 3]     = (Math.random() - 0.5) * 220;
      pos[i * 3 + 1] = 5 + Math.random() * 40;
      pos[i * 3 + 2] = -50 - Math.random() * 80;
    }
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    const mat = new THREE.PointsMaterial({
      size: 2.5, map: roundTexture, color: 0x00ccff,
      transparent: true, opacity: 0, blending: THREE.AdditiveBlending,
      depthWrite: false, sizeAttenuation: false
    });
    this.bokeh = new THREE.Points(geo, mat);
    this.scene.add(this.bokeh);
  }
  
  update(delta) {
    const gb = PULSE_SETTINGS.rainBrightness;
    if (this.rain) {
      this.rain.material.opacity = gb;
      const positions = this.rain.geometry.attributes.position.array;
      const speeds = this.rain.userData.speeds;
      for (let i = 0; i < positions.length / 3; i++) {
        positions[i * 3 + 1] -= speeds[i] * delta;
        if (positions[i * 3 + 1] < -5) {
          positions[i * 3 + 1] = 80 + Math.random() * 20;
          positions[i * 3]     = (Math.random() - 0.5) * 220;
          positions[i * 3 + 2] = -40 - Math.random() * 80;
        }
      }
      this.rain.geometry.attributes.position.needsUpdate = true;
    }
    if (this.bokeh) {
      this.bokeh.material.opacity = gb * 0.8;
      const positions = this.bokeh.geometry.attributes.position.array;
      for (let i = 0; i < positions.length / 3; i++) {
        positions[i * 3]     += delta * 1.5;
        positions[i * 3 + 1] += delta * 0.8;
        if (positions[i * 3] > 130) positions[i * 3] = -130;
        if (positions[i * 3 + 1] > 50) positions[i * 3 + 1] = 0;
      }
      this.bokeh.geometry.attributes.position.needsUpdate = true;
    }
  }
}

const digitalRainBackground = new DigitalRainBackground(scene);

/* ============================================================================
 * ⑧ 设备配置
 * ============================================================================
 */
const devices = [
  { x: -30, z: 0, state: STATES.IDLE },
  { x: 0,   z: 0, state: STATES.ACTIVE },
  { x: 30,  z: 0, state: STATES.ALERT }
];

devices.forEach(device => {
  const pcGroup = new THREE.Group();
  pcGroup.position.set(device.x, 0, device.z);
  
  // 机箱
  const pcCase = new THREE.Mesh(
    new THREE.BoxGeometry(4, 8, 8),
    new THREE.MeshStandardMaterial({ color: 0x1a1a24, roughness: 0.2, metalness: 0.8 })
  );
  pcCase.position.set(2, 4, 0);
  pcGroup.add(pcCase);
  
  // 显示器
  const monitor = new THREE.Mesh(
    new THREE.BoxGeometry(0.3, 5, 9),
    new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.1, metalness: 0.9 })
  );
  monitor.position.set(-4, 6, 0);
  pcGroup.add(monitor);
  
  // 屏幕发光面（会跟随状态闪烁）
  const screenGlow = new THREE.Mesh(
    new THREE.PlaneGeometry(8, 4.5),
    new THREE.MeshBasicMaterial({ color: 0x111111 })
  );
  screenGlow.position.set(-4.16, 6, 0);
  screenGlow.rotation.y = -Math.PI / 2;
  pcGroup.add(screenGlow);
  
  // 支架
  const stand = new THREE.Mesh(
    new THREE.CylinderGeometry(0.3, 0.3, 2.5),
    new THREE.MeshStandardMaterial({ color: 0x333333 })
  );
  stand.position.set(-4, 1.25, 0);
  pcGroup.add(stand);
  
  scene.add(pcGroup);
  
  device.screenGlow = screenGlow;
  device.pulseQueue = [];
  device.nextBurstTime = 0;
  device.origin = new THREE.Vector3(device.x + 2, 0, 0);
});

/* ============================================================================
 * ⑨ 爆发调度
 * ============================================================================
 */
function triggerBurst(device) {
  const state = device.state;
  if (state === STATES.OFFLINE) return;
  
  const burstCount = state.burst;
  for (let i = 0; i < burstCount; i++) {
    const delay = i === 0 ? 0 : (i === 1 ? 0.2 : 0.35);
    device.pulseQueue.push({
      triggerTime: clock.getElapsedTime() + delay,
      color: state.color,
      amplitude: state.amplitude
    });
  }
}

/* ============================================================================
 * ⑩ 主循环
 * ============================================================================
 */
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const delta = clock.getDelta();
  const elapsedTime = clock.getElapsedTime();
  
  // 更新地形和背景
  rippleTerrain.update(delta);
  digitalRainBackground.update(delta);
  
  // 更新设备
  devices.forEach(device => {
    if (device.state === STATES.OFFLINE) return;
    
    // 触发新的爆发
    if (elapsedTime > device.nextBurstTime) {
      triggerBurst(device);
      device.nextBurstTime = elapsedTime + device.state.interval;
      
      // 屏幕跟着闪一下
      device.screenGlow.material.color.setHex(device.state.color);
      setTimeout(() => {
        device.screenGlow.material.color.setHex(0x111111);
      }, 400);
    }
    
    // 处理延迟队列：在设备位置激起涟漪
    for (let i = device.pulseQueue.length - 1; i >= 0; i--) {
      if (elapsedTime >= device.pulseQueue[i].triggerTime) {
        const { color, amplitude } = device.pulseQueue[i];
        rippleTerrain.addRipple(device.origin.x, device.origin.z, color, amplitude);
        device.pulseQueue.splice(i, 1);
      }
    }
  });
  
  controls.update();
  composer.render();
}

animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
});

/* ============================================================================
 * ⑪ 调试面板绑定
 * ============================================================================
 */
window.setPulseSetting = function(key, value) {
  if (key in PULSE_SETTINGS) PULSE_SETTINGS[key] = parseFloat(value);
};

function bindSlider(id, key, displayId) {
  const slider = document.getElementById(id);
  const display = document.getElementById(displayId);
  const update = () => {
    window.setPulseSetting(key, slider.value);
    display.textContent = PULSE_SETTINGS[key].toFixed(2);
  };
  slider.addEventListener('input', update);
  update();
}
bindSlider('rippleHeight',    'rippleHeight',    'v1');
bindSlider('rippleSpeed',     'rippleSpeed',     'v2');
bindSlider('rippleThickness', 'rippleThickness', 'v3');
bindSlider('rippleBrightness','rippleBrightness','v4');
bindSlider('rippleMaxAge',    'rippleMaxAge',    'v5');
bindSlider('rainBrightness',  'rainBrightness',  'v6');

/* ============================================================================
 * ⑫ 设备状态演示按钮
 * ============================================================================
 */
function setAllButtons(activeId) {
  document.querySelectorAll('.btn-row button').forEach(b => b.classList.remove('active'));
  document.getElementById(activeId).classList.add('active');
}

document.getElementById('allOnline').onclick = () => {
  devices[0].state = STATES.IDLE;
  devices[1].state = STATES.ACTIVE;
  devices[2].state = STATES.ALERT;
  devices.forEach(d => d.nextBurstTime = 0);
  setAllButtons('allOnline');
};

document.getElementById('onlyOne').onclick = () => {
  devices[0].state = STATES.OFFLINE;
  devices[1].state = STATES.ACTIVE;
  devices[2].state = STATES.OFFLINE;
  devices[1].nextBurstTime = 0;
  setAllButtons('onlyOne');
};

document.getElementById('allOffline').onclick = () => {
  devices.forEach(d => d.state = STATES.OFFLINE);
  setAllButtons('allOffline');
};
</script>
</body>
</html>
